apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  labels:
    app: serving-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving-api
  template:
    metadata:
      labels:
        app: serving-api
    spec:
      containers:
        - name: serving-api
          image: serving-api:placeholder
          ports:
            - containerPort: 8000
          env:
            - name: STOCK_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: serving-api-secrets
                  key: api-keys
            - name: MLFLOW_TRACKING_URI
              value: "file:/mlruns"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: serving-api
  labels:
    app: serving-api
spec:
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: serving-api
  type: ClusterIP
