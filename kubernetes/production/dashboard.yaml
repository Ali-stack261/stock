apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-dashboard
  labels:
    app: prediction-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction-dashboard
  template:
    metadata:
      labels:
        app: prediction-dashboard
    spec:
      containers:
        - name: dashboard
          image: ${{ secrets.REGISTRY_URL }}/dashboard:${{ github.sha }}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-dashboard
  labels:
    app: prediction-dashboard
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: prediction-dashboard
  type: ClusterIP
