global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "stock-mlops-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /prometheus
