groups:
  - name: stock_mlops_alerts
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # Infrastructure: high prediction latency
      # -----------------------------------------------------------------------
      - alert: HighPredictLatency
        expr: |
          histogram_quantile(0.99,
            rate(predict_latency_seconds_bucket[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 prediction latency is above 1 s"
          description: >
            The 99th percentile latency of /predict requests has exceeded 1 second
            for more than 5 minutes (current: {{ $value | humanizeDuration }}).

      # -----------------------------------------------------------------------
      # ML: rolling RMSE spike
      # -----------------------------------------------------------------------
      - alert: HighRollingRMSE
        expr: rolling_rmse > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Rolling RMSE spike detected for {{ $labels.symbol }}"
          description: >
            The rolling prediction RMSE for {{ $labels.symbol }} has exceeded 500
            for more than 5 minutes (current: {{ $value | humanize }}).
            Possible model drift — consider triggering retraining.

      # -----------------------------------------------------------------------
      # ML: high error rate
      # -----------------------------------------------------------------------
      - alert: HighPredictErrorRate
        expr: |
          rate(predict_requests_total{status="error"}[5m])
          /
          rate(predict_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prediction error rate above 5% for {{ $labels.symbol }}"
          description: >
            More than 5% of /predict requests are returning errors for
            {{ $labels.symbol }} over the last 5 minutes.
